services:
  backend:
    image: wger/server:testbot
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=settings.ci
      - DJANGO_MEDIA_ROOT=/tmp/wger-media
      - DJANGO_PERFORM_MIGRATIONS=True
      - WGER_USE_GUNICORN=False
      - DJANGO_COLLECTSTATIC_ON_STARTUP=False
      - DJANGO_CLEAR_STATIC_FIRST=False
      - SYNC_EXERCISES_ON_STARTUP=False
      - DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP=False
      - DOWNLOAD_EXERCISE_VIDEOS_ON_STARTUP=False
      - LOAD_ONLINE_FIXTURES_ON_STARTUP=False
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/api/v2/language/"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: .skyramp/sut/Dockerfile.frontend
      args:
        VITE_API_SERVER: http://localhost:8000
    image: wger/react:testbot
    environment:
      # Read by Vite at dev-server start; the app has no usable login form, so
      # without it every API request goes out unauthenticated. start-sut.sh
      # mints it once the backend is up.
      - VITE_API_KEY=${VITE_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
